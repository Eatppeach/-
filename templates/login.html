<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 大模型数据防护能力平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: linear-gradient(135deg, #1a73e8, #0d47a1); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; border-radius: 12px; padding: 40px; width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .login-box h1 { text-align: center; font-size: 22px; color: #1a73e8; margin-bottom: 8px; }
        .login-box .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #555; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 14px; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: #1a73e8; }
        .btn-login { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #1a73e8; color: #fff; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background: #1557b0; }
        .btn-login:disabled { background: #ccc; cursor: not-allowed; }
        .error-msg { color: #e53935; text-align: center; font-size: 13px; margin-top: 12px; display: none; }
        .error-msg.show { display: block; }
        .hint { text-align: center; margin-top: 20px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>大模型数据防护能力平台</h1>
        <p class="subtitle">请登录以继续</p>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" value="admin" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码" value="admin123" autocomplete="current-password">
        </div>
        <button class="btn-login" id="loginBtn" onclick="doLogin()">登 录</button>
        <div class="error-msg" id="errorMsg"></div>
        <p class="hint">默认管理员账号: admin / admin123</p>
    </div>
    <script>
        // 回车键触发登录
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('username').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });

        function doLogin() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var btn = document.getElementById('loginBtn');
            var err = document.getElementById('errorMsg');

            if (!username || !password) {
                err.textContent = '请输入用户名和密码';
                err.className = 'error-msg show';
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';
            err.className = 'error-msg';

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.ok) {
                    location.href = '/';
                } else {
                    err.textContent = data.error || '登录失败';
                    err.className = 'error-msg show';
                    btn.disabled = false;
                    btn.textContent = '登 录';
                }
            })
            .catch(function() {
                err.textContent = '网络错误，请重试';
                err.className = 'error-msg show';
                btn.disabled = false;
                btn.textContent = '登 录';
            });
        }
    </script>
</body>
</html>
