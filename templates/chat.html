{% extends "base.html" %}
{% block title %}实时对话 - 大模型数据防护能力平台{% endblock %}
{% block content %}
<style>
    .chat-container { display: flex; gap: 20px; height: calc(100vh - 150px); }
    .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-sidebar { width: 300px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }

    .chat-header {
        padding: 12px 20px; margin-bottom: 12px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .chat-header .conn-status { display: flex; align-items: center; gap: 8px; }

    .chat-messages {
        flex: 1; overflow-y: auto;
        background: var(--surface); border-radius: var(--radius-lg);
        padding: 20px; box-shadow: var(--shadow);
        margin-bottom: 12px; border: 1px solid var(--border);
    }

    .msg { margin-bottom: 18px; display: flex; gap: 10px; animation: msgIn 0.3s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
        width: 36px; height: 36px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .msg.user .msg-avatar { background: linear-gradient(135deg, var(--primary), #6366f1); }
    .msg.assistant .msg-avatar { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .msg.system .msg-avatar { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .msg-content {
        max-width: 75%; padding: 12px 16px; border-radius: 14px;
        font-size: 14px; line-height: 1.65; word-break: break-word;
    }
    .msg.user .msg-content { background: linear-gradient(135deg, var(--primary-light), #e0e7ff); color: #1e293b; border-bottom-right-radius: 4px; }
    .msg.assistant .msg-content { background: #f8fafc; color: #1e293b; border-bottom-left-radius: 4px; border: 1px solid #f1f5f9; }
    .msg.system .msg-content { background: #fffbeb; color: #92400e; font-size: 12.5px; border-radius: 10px; text-align: center; border: 1px solid #fde68a; }

    /* ===== Markdown 渲染样式 ===== */
    .msg-content.markdown-body { max-width: 80%; line-height: 1.75; }
    .msg-content.markdown-body h1, .msg-content.markdown-body h2, .msg-content.markdown-body h3, .msg-content.markdown-body h4 { margin: 14px 0 8px; font-weight: 700; color: #1e293b; }
    .msg-content.markdown-body h1 { font-size: 1.3em; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
    .msg-content.markdown-body h2 { font-size: 1.15em; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }
    .msg-content.markdown-body h3 { font-size: 1.05em; }
    .msg-content.markdown-body h4 { font-size: 1em; }
    .msg-content.markdown-body p { margin: 6px 0; }
    .msg-content.markdown-body p:first-child { margin-top: 0; }
    .msg-content.markdown-body p:last-child { margin-bottom: 0; }
    .msg-content.markdown-body ul, .msg-content.markdown-body ol { padding-left: 20px; margin: 6px 0; }
    .msg-content.markdown-body li { margin: 3px 0; }
    .msg-content.markdown-body li::marker { color: var(--primary); }
    .msg-content.markdown-body code {
        font-family: "JetBrains Mono", "Consolas", "Courier New", monospace;
        background: #e8ecf3; padding: 2px 6px; border-radius: 4px;
        font-size: 0.88em; color: #d63384;
    }
    .msg-content.markdown-body pre {
        background: #1e293b; color: #e2e8f0; padding: 14px 16px;
        border-radius: 8px; overflow-x: auto; margin: 10px 0;
        font-size: 0.85em; line-height: 1.55;
    }
    .msg-content.markdown-body pre code {
        background: none; padding: 0; color: inherit; font-size: inherit;
        border-radius: 0;
    }
    .msg-content.markdown-body blockquote {
        border-left: 3px solid var(--primary); padding: 6px 14px;
        margin: 8px 0; color: #64748b; background: #f8fafc;
        border-radius: 0 6px 6px 0;
    }
    .msg-content.markdown-body table {
        border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.9em;
    }
    .msg-content.markdown-body th, .msg-content.markdown-body td {
        border: 1px solid #e2e8f0; padding: 8px 12px; text-align: left;
    }
    .msg-content.markdown-body th { background: #f8fafc; font-weight: 600; }
    .msg-content.markdown-body strong { font-weight: 700; color: #1e293b; }
    .msg-content.markdown-body a { color: var(--primary); text-decoration: underline; }
    .msg-content.markdown-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 12px 0; }
    .msg-content.markdown-body em { font-style: italic; }

    .msg-content .sensitive-warn {
        display: inline-block; color: #d97706; font-size: 12px;
        padding: 4px 10px; background: #fffbeb; border-radius: 6px;
        margin-top: 6px; border: 1px solid #fde68a;
    }

    .chat-input-area { display: flex; gap: 10px; }
    .chat-input-area textarea {
        flex: 1; padding: 12px 16px; border: 1.5px solid var(--border);
        border-radius: var(--radius); font-size: 14px; resize: none;
        height: 60px; font-family: inherit; background: #fff;
        transition: all var(--transition); color: var(--text);
    }
    .chat-input-area textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .chat-input-area button {
        padding: 0 28px; border: none; border-radius: var(--radius);
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
        transition: all var(--transition); font-family: inherit;
        box-shadow: 0 2px 8px var(--primary-glow);
    }
    .chat-input-area button:hover { box-shadow: 0 4px 16px rgba(79,110,247,0.35); transform: translateY(-1px); }
    .chat-input-area button:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; transform: none; }

    .upload-zone {
        border: 2px dashed #d0d8e8; border-radius: 10px;
        padding: 10px 16px; margin-bottom: 10px; text-align: center;
        color: var(--text-muted); font-size: 13px; cursor: pointer;
        transition: all var(--transition); position: relative; background: #fafbfc;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .upload-zone input[type="file"] { display: none; }
    .upload-zone .upload-icon { font-size: 18px; margin-right: 6px; vertical-align: middle; }
    .doc-chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 14px; background: var(--primary-light);
        border: 1px solid #c7d2fe; border-radius: 20px;
        font-size: 12px; color: var(--primary); margin-bottom: 8px; max-width: 100%;
    }
    .doc-chip .doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
    .doc-chip .doc-remove { cursor: pointer; color: var(--danger); font-weight: bold; font-size: 14px; line-height: 1; transition: transform 0.2s; }
    .doc-chip .doc-remove:hover { color: #b91c1c; transform: scale(1.2); }
    .upload-spinner {
        display: inline-block; width: 14px; height: 14px;
        border: 2px solid #e2e8f0; border-top-color: var(--primary);
        border-radius: 50%; animation: spin 0.8s linear infinite;
        vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sidebar-card { padding: 18px; }
    .sidebar-card h3 { font-size: 14px; margin-bottom: 14px; color: var(--text); font-weight: 600; }
    .sidebar-card label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
    .sidebar-card input, .sidebar-card select {
        width: 100%; padding: 8px 12px; border: 1.5px solid var(--border);
        border-radius: 7px; font-size: 13px; font-family: inherit;
        transition: all var(--transition); background: #fff; color: var(--text);
    }
    .sidebar-card input:focus, .sidebar-card select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

    .typing-indicator { display: flex; gap: 5px; padding: 4px 0; }
    .typing-indicator span {
        width: 7px; height: 7px; border-radius: 50%;
        background: #94a3b8; animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .preset-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .preset-btns button {
        padding: 5px 12px; border: 1.5px solid var(--border);
        border-radius: 16px; background: #fff; font-size: 12px;
        cursor: pointer; color: var(--text-secondary); transition: all var(--transition);
        font-family: inherit;
    }
    .preset-btns button:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .clear-btn {
        padding: 6px 16px; border: 1.5px solid var(--border);
        border-radius: 7px; background: #fff; font-size: 13px;
        cursor: pointer; color: var(--text-muted); transition: all var(--transition);
        font-family: inherit;
    }
    .clear-btn:hover { background: #fef2f2; color: var(--danger); border-color: #fecaca; }

    @media (max-width: 768px) {
        .chat-container { flex-direction: column; height: auto; }
        .chat-sidebar { width: 100%; }
        .chat-messages { max-height: 50vh; }
    }
</style>

<div class="chat-container">
    <!-- 左侧：对话区 -->
    <div class="chat-main">
        <div class="card chat-header">
            <div class="conn-status">
                <span class="status-dot" id="statusDot" style="animation: none; box-shadow: none;"></span>
                <strong style="font-size: 14px;">AI 安全对话</strong>
                <span style="font-size: 12px; color: var(--text-muted); margin-left: 8px;" id="modelLabel">未连接</span>
            </div>
            <button class="clear-btn" onclick="clearChat()">清空对话</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="msg system">
                <div class="msg-content">
                    欢迎使用大模型安全对话！<br>
                    请在右侧配置 LLM 连接信息，然后开始对话。支持上传 Word / PDF / TXT 文档，系统将自动提取文本并<strong>脱敏处理</strong>后再发送给大模型。
                </div>
            </div>
        </div>

        <!-- 文档上传区域 -->
        <div id="docChipArea" style="margin-bottom: 4px;"></div>
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon">📎</span> 上传文档（Word / PDF / TXT），内容将自动脱敏后发送
            <input type="file" id="fileInput" accept=".docx,.pdf,.txt,.md" onchange="handleFileSelect(event)">
        </div>

        <div class="chat-input-area">
            <textarea id="userInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行" onkeydown="handleKeyDown(event)"></textarea>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <!-- 右侧：配置面板 -->
    <div class="chat-sidebar">
        <div class="card sidebar-card">
            <h3>⚙ LLM 连接配置</h3>
            <div class="form-group">
                <label>API 地址</label>
                <input id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions" value="">
            </div>
            <div class="form-group">
                <label>API Key</label>
                <input id="apiKey" type="password" placeholder="sk-..." value="">
            </div>
            <div class="form-group">
                <label>模型</label>
                <select id="modelSelect">
                    <option value="gpt-4o">gpt-4o</option>
                    <option value="gpt-4o-mini">gpt-4o-mini</option>
                    <option value="gpt-3.5-turbo" selected>gpt-3.5-turbo</option>
                    <option value="deepseek-chat">deepseek-chat</option>
                    <option value="qwen-turbo">qwen-turbo</option>
                    <option value="glm-4">glm-4</option>
                </select>
            </div>
            <div class="form-group">
                <label>用户标识</label>
                <input id="userId" placeholder="demo_user" value="demo_user">
            </div>
            <button class="btn btn-primary" onclick="connectLLM()" style="width:100%; margin-top:6px;">连接 LLM</button>
        </div>

        <div class="card sidebar-card">
            <h3>🧪 快捷测试</h3>
            <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">测试安全网关的脱敏效果</p>
            <div class="preset-btns">
                <button onclick="quickTest('idcard')">含身份证号</button>
                <button onclick="quickTest('phone')">含手机号</button>
                <button onclick="quickTest('all')">综合敏感信息</button>
                <button onclick="quickTest('normal')">普通问题</button>
            </div>
        </div>

        <div class="card sidebar-card" id="securityCard" style="display:none;">
            <h3>🔍 安全检测详情</h3>
            <div id="securityDetail" style="font-size:12px; color:#d97706;"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@11.1.0/marked.min.js"></script>
<script>
// 配置 marked 渲染器
marked.setOptions({
    breaks: true,
    gfm: true,
});
const renderer = new marked.Renderer();
renderer.code = function({ text, lang }) {
    var langLabel = lang ? '<span style="position:absolute;top:4px;right:10px;font-size:10px;color:#94a3b8;">' + lang + '</span>' : '';
    return '<pre style="position:relative;">' + langLabel + '<code>' + (text || '') + '</code></pre>';
};
marked.use({ renderer: renderer });

let chatHistory = [];
let llmConfig = { url: '', key: '', model: 'gpt-3.5-turbo' };
let isStreaming = false;
let documentText = '';
let documentFileName = '';

document.addEventListener('DOMContentLoaded', function() {
    try {
        var saved = localStorage.getItem('llm_config');
        if (saved) {
            var cfg = JSON.parse(saved);
            if (cfg.url) llmConfig.url = cfg.url;
            if (cfg.key) llmConfig.key = cfg.key;
            if (cfg.model) llmConfig.model = cfg.model;

            var apiUrlEl = document.getElementById('apiUrl');
            var apiKeyEl = document.getElementById('apiKey');
            var modelEl = document.getElementById('modelSelect');

            if (apiUrlEl) apiUrlEl.value = llmConfig.url;
            if (apiKeyEl) apiKeyEl.value = llmConfig.key;
            if (modelEl && llmConfig.model) modelEl.value = llmConfig.model;

            if (llmConfig.url) {
                var dot = document.getElementById('statusDot');
                var label = document.getElementById('modelLabel');
                if (dot) { dot.className = 'status-dot on'; }
                if (label) {
                    label.textContent = llmConfig.model + ' (已连接)';
                    label.style.color = '#22c55e';
                }
            }
        }
    } catch (e) {
        localStorage.removeItem('llm_config');
    }

    var zone = document.getElementById('uploadZone');
    if (zone) {
        zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', function() { zone.classList.remove('drag-over'); });
        zone.addEventListener('drop', function(e) {
            e.preventDefault();
            zone.classList.remove('drag-over');
            var files = e.dataTransfer.files;
            if (files.length > 0) uploadFile(files[0]);
        });
    }
});

function connectLLM() {
    var apiUrlEl = document.getElementById('apiUrl');
    var apiKeyEl = document.getElementById('apiKey');
    var modelEl = document.getElementById('modelSelect');

    llmConfig.url = apiUrlEl.value.trim();
    llmConfig.key = apiKeyEl.value.trim();
    llmConfig.model = modelEl.value;

    if (!llmConfig.url) {
        showToast('请输入 API 地址', 'error');
        return;
    }

    localStorage.setItem('llm_config', JSON.stringify({
        url: llmConfig.url,
        key: llmConfig.key,
        model: llmConfig.model
    }));

    var dot = document.getElementById('statusDot');
    var label = document.getElementById('modelLabel');
    if (dot) dot.className = 'status-dot on';
    if (label) {
        label.textContent = llmConfig.model + ' (已连接)';
        label.style.color = '#22c55e';
    }
    showToast('LLM 连接成功');
}

function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function handleFileSelect(e) {
    var file = e.target.files[0];
    if (file) uploadFile(file);
    e.target.value = '';
}

async function uploadFile(file) {
    var zone = document.getElementById('uploadZone');
    var originalHtml = zone.innerHTML;

    zone.innerHTML = '<span class="upload-spinner"></span> 正在解析文档...';
    zone.style.pointerEvents = 'none';

    var formData = new FormData();
    formData.append('file', file);

    try {
        var resp = await fetch('/api/upload', { method: 'POST', body: formData });
        var data = await resp.json();

        if (!resp.ok) {
            showToast(data.error || '文件上传失败', 'error');
            zone.innerHTML = originalHtml;
            zone.style.pointerEvents = '';
            return;
        }

        documentText = data.text;
        documentFileName = data.filename;
        showDocChip(data.filename, data.char_count);
        showToast('文档解析成功，共 ' + data.char_count + ' 字符', 'success');
    } catch (e) {
        showToast('文件上传失败: ' + e.message, 'error');
    }

    zone.innerHTML = originalHtml;
    zone.style.pointerEvents = '';
}

function showDocChip(filename, charCount) {
    var area = document.getElementById('docChipArea');
    var sizeInfo = charCount > 1000 ? (charCount / 1000).toFixed(1) + 'k' : charCount;
    area.innerHTML = '<div class="doc-chip">'
        + '<span>📄</span>'
        + '<span class="doc-name" title="' + escapeHtml(filename) + '">' + escapeHtml(filename) + '</span>'
        + '<span style="color:var(--text-muted);">(' + sizeInfo + '字)</span>'
        + '<span class="doc-remove" onclick="removeDocument()" title="移除文档">✕</span>'
        + '</div>';
}

function removeDocument() {
    documentText = '';
    documentFileName = '';
    document.getElementById('docChipArea').innerHTML = '';
    showToast('文档已移除', 'info');
}

async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text || isStreaming) return;

    if (!llmConfig.url) {
        showToast('请先在右侧配置并连接 LLM', 'error');
        return;
    }

    input.value = '';
    isStreaming = true;
    document.getElementById('sendBtn').disabled = true;

    var displayText = text;
    if (documentText) {
        displayText = '📄 ' + documentFileName + '\n' + text;
    }

    addMessage('user', displayText);
    chatHistory.push({ role: 'user', content: text });

    const assistantMsg = addMessage('assistant', '');
    const contentDiv = assistantMsg.querySelector('.msg-content');

    contentDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
    scrollToBottom();

    try {
        const userId = document.getElementById('userId').value || 'demo_user';
        const resp = await fetch('/api/gateway/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: text,
                document_text: documentText,
                history: chatHistory.slice(0, -1),
                upstream_url: llmConfig.url,
                api_key: llmConfig.key,
                model: llmConfig.model,
                stream: true,
                user_id: userId
            })
        });

        if (!resp.ok) {
            const err = await resp.json();
            contentDiv.innerHTML = '<span style="color:#ef4444;">[错误] ' + (err.message || '请求失败') + '</span>';
            if (err.scan_result) showSecurityDetail(err.scan_result);
            return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullContent = '';
        let done = false;
        let lastRenderLen = 0;

        while (!done) {
            const { value, done: streamDone } = await reader.read();
            if (streamDone) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const data = line.slice(6);
                if (data === '[DONE]') { done = true; break; }
                try {
                    const json = JSON.parse(data);
                    if (json.error) {
                        contentDiv.innerHTML = '<span style="color:#ef4444;">[错误] ' + json.error + '</span>';
                        done = true;
                        break;
                    }
                    if (json.warning) {
                        const warn = document.createElement('span');
                        warn.className = 'sensitive-warn';
                        warn.textContent = ' ⚠ ' + json.note;
                        contentDiv.appendChild(warn);
                        continue;
                    }
                    const delta = json.choices?.[0]?.delta?.content;
                    if (delta) {
                        fullContent += delta;
                        // 每累积 60 个字符或遇到换行时刷新一次渲染，避免频繁 DOM 操作
                        if (fullContent.length - lastRenderLen > 60 || delta.includes('\n')) {
                            lastRenderLen = fullContent.length;
                            contentDiv.innerHTML = marked.parse(fullContent);
                            scrollToBottom();
                        }
                    }
                } catch (e) {}
            }
        }
        // 流结束后做最终渲染
        contentDiv.innerHTML = marked.parse(fullContent);
        scrollToBottom();

        if (fullContent) {
            chatHistory.push({ role: 'assistant', content: fullContent });
        }

    } catch (e) {
        contentDiv.innerHTML = '<span style="color:#ef4444;">[网络错误] ' + e.message + '</span>';
    } finally {
        isStreaming = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('userInput').focus();
    }
}

function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    var avatar = role === 'user' ? 'U' : role === 'assistant' ? 'AI' : '!';
    var contentHtml;
    if (role === 'assistant' && text) {
        contentHtml = '<div class="msg-content markdown-body">' + marked.parse(text) + '</div>';
    } else if (role === 'assistant') {
        contentHtml = '<div class="msg-content markdown-body"></div>';
    } else {
        contentHtml = '<div class="msg-content">' + escapeHtml(text) + '</div>';
    }
    div.innerHTML = '<div class="msg-avatar">' + avatar + '</div>' + contentHtml;
    document.getElementById('chatMessages').appendChild(div);
    scrollToBottom();
    return div;
}

function showSecurityDetail(scanResult) {
    const card = document.getElementById('securityCard');
    const detail = document.getElementById('securityDetail');
    card.style.display = 'block';
    let html = '';
    if (scanResult.matches && scanResult.matches.length > 0) {
        html = '<p>检测到 <strong>' + scanResult.match_count + '</strong> 处敏感信息:</p><ul style="padding-left:16px;margin-top:4px;">';
        scanResult.matches.forEach(m => {
            html += '<li>' + m.rule_name + ': <code>' + m.matched_text + '</code></li>';
        });
        html += '</ul>';
    }
    detail.innerHTML = html;
}

function scrollToBottom() {
    const el = document.getElementById('chatMessages');
    el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
}

function clearChat() {
    chatHistory = [];
    documentText = '';
    documentFileName = '';
    document.getElementById('docChipArea').innerHTML = '';
    document.getElementById('chatMessages').innerHTML = '<div class="msg system"><div class="msg-avatar">!</div><div class="msg-content">对话已清空。所有输入将经过安全网关处理。</div></div>';
}

function quickTest(type) {
    const tests = {
        'idcard': '请问身份证号110101199001011234属于哪个地区？',
        'phone': '帮我查一下手机号13812345678的归属地',
        'all': '请帮我登记以下信息：姓名张三，身份证110101199001011234，手机13812345678，邮箱zhangsan@example.com，银行卡6222021234567890123',
        'normal': '请介绍一下大模型数据安全防护的重要性'
    };
    document.getElementById('userInput').value = tests[type] || '';
    document.getElementById('userInput').focus();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
